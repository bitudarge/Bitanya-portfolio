<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bitanya Darge</title>
    <meta name="description" content="Data Analyst at John Deere. Data Science & Neuroscience at Augustana College." />
    <meta property="og:title" content="Bitanya Darge" />
    <meta property="og:description" content="Data Analyst at John Deere. Data Science & Neuroscience at Augustana College." />
    <meta property="og:image" content="https://bitanyadarge.com/assets/connect/bitanya.jpg" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/x-icon" href="/bitanya_icon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --text: #1a1a1a;
        --muted: #5c5c5c;
        --border: #ececec;
        --accent: #db2777;
        --accent-soft: #fce7f3;
        --display: "Fraunces", Georgia, serif;
        --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body {
        font-family: var(--body);
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100svh;
        padding: max(40px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom));
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Same soft pink glow as the portfolio */
      .glow { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
      .glow span {
        position: absolute; border-radius: 50%; filter: blur(70px);
        animation: drift 18s ease-in-out infinite;
      }
      .glow .a { width: 340px; height: 340px; top: -80px; left: -120px; background: var(--accent); opacity: 0.16; }
      .glow .b { width: 300px; height: 300px; bottom: 6%; right: -110px; background: var(--accent-soft); opacity: 0.9; animation-duration: 22s; }
      @keyframes drift { 50% { transform: translate3d(24px, 30px, 0); } }

      main { width: 100%; max-width: 420px; text-align: center; }

      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--accent); background: var(--accent-soft);
        padding: 6px 12px; border-radius: 999px; margin-bottom: 28px;
      }

      .photo {
        width: 132px; height: 132px; border-radius: 50%; object-fit: cover; display: block;
        margin: 0 auto 36px;
        border: 4px solid #fff;
        box-shadow: 0 0 0 2px var(--accent), 0 18px 40px -16px rgba(219, 39, 119, 0.55);
      }

      /* Name stays available to screen readers without showing on screen */
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      .actions { display: grid; gap: 12px; margin-bottom: 30px; }
      .btn {
        display: flex; align-items: center; gap: 14px;
        padding: 16px 20px; border-radius: 14px;
        font-weight: 600; font-size: 1rem; color: var(--text); text-decoration: none;
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        box-shadow: 0 10px 24px -18px rgba(26, 26, 26, 0.35);
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        -webkit-tap-highlight-color: transparent;
      }
      .btn:hover, .btn:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
      .btn:active { transform: scale(0.98); }
      .btn svg { flex-shrink: 0; color: var(--accent); }
      .btn .arrow { margin-left: auto; color: #b5b5b5; }
      .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 14px 28px -14px rgba(219, 39, 119, 0.75); }
      .btn.primary svg, .btn.primary .arrow { color: #fff; }

      .portfolio {
        display: inline-flex; align-items: center; gap: 6px;
        font-weight: 600; font-size: 0.95rem; color: var(--muted); text-decoration: none;
        border-bottom: 1px solid transparent; transition: color 160ms ease, border-color 160ms ease;
      }
      .portfolio:hover { color: var(--accent); border-color: var(--accent); }

      /* Staggered rise-in on load */
      .rise { opacity: 0; transform: translateY(16px); animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: calc(var(--d) * 70ms); }
      @keyframes rise { to { opacity: 1; transform: none; } }

      @media (prefers-reduced-motion: reduce) {
        .rise { opacity: 1; transform: none; animation: none; }
        .glow span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"><span class="a"></span><span class="b"></span></div>

    <main>
      <h1 class="sr-only">Bitanya Darge</h1>
      <div class="badge rise" style="--d: 0">

        Tapped in
      </div>

      <img class="photo rise" style="--d: 1" src="/assets/connect/bitanya.jpg" alt="Bitanya Darge" width="132" height="132" />


      <nav class="actions" aria-label="Connect">
        <a class="btn primary rise" style="--d: 5" href="/bitanya-darge.vcf" download="Bitanya-Darge.vcf">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Save my contact
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
        <a class="btn rise" style="--d: 6" href="https://www.linkedin.com/in/bitanya-darge" target="_blank" rel="noopener noreferrer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 10v6.5M7.5 7.6v.01M11.5 16.5V10M11.5 12.8c0-1.5 1-2.8 2.5-2.8s2.5 1 2.5 2.8v3.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Connect on LinkedIn
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
        <a class="btn rise" style="--d: 7" href="/Bitanya_Darge_Resume.pdf" target="_blank" rel="noopener">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l5 5v13H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5M10 13h6M10 17h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          View my resume
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
        <a class="btn rise" style="--d: 8" href="https://github.com/bitudarge" target="_blank" rel="noopener noreferrer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5c-5.25 0-9.5 4.25-9.5 9.5 0 4.2 2.73 7.76 6.5 9.02.48.09.65-.21.65-.46v-1.82c-2.64.57-3.2-1.14-3.2-1.14-.43-1.1-1.06-1.39-1.06-1.39-.87-.59.07-.58.07-.58.96.07 1.47.99 1.47.99.86 1.47 2.25 1.05 2.8.8.09-.62.33-1.05.6-1.29-2.1-.24-4.3-1.05-4.3-4.67 0-1.03.37-1.87.98-2.53-.1-.24-.42-1.22.1-2.55 0 0 .8-.26 2.63.98a9.1 9.1 0 0 1 4.8 0c1.83-1.24 2.63-.98 2.63-.98.52 1.33.2 2.31.1 2.55.61.66.98 1.5.98 2.53 0 3.63-2.21 4.43-4.32 4.66.34.3.64.87.64 1.76v2.6c0 .25.17.56.65.46 3.76-1.27 6.49-4.82 6.49-9.02 0-5.25-4.25-9.5-9.5-9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          GitHub
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
        <a class="btn rise" style="--d: 9" href="mailto:bitanyadarge@gmail.com">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 7l7.25 5.5a1.2 1.2 0 0 0 1.5 0L20 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Email me
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
      </nav>

      <a class="portfolio rise" style="--d: 10" href="/">See my full portfolio <span aria-hidden="true">&rarr;</span></a>
    </main>
  </body>
</html>
