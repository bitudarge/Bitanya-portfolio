    <style>
      :root {
        --bg: #ffffff;
        --text: #1a1a1a;
        --muted: #5c5c5c;
        --border: #ececec;
        --accent: #db2777;
        --accent-soft: #fce7f3;
        --card-text: #f7f2f5;
        --card-pink: #f9a8d4;
        --display: "Fraunces", Georgia, serif;
        --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: var(--body);
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .glow { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
      .glow span {
        position: absolute; border-radius: 50%; filter: blur(70px);
        animation: drift 18s ease-in-out infinite;
      }
      .glow .a { width: 340px; height: 340px; top: -80px; left: -120px; background: var(--accent); opacity: 0.16; }
      .glow .b { width: 300px; height: 300px; bottom: 6%; right: -110px; background: var(--accent-soft); opacity: 0.9; animation-duration: 22s; }
      @keyframes drift { 50% { transform: translate3d(24px, 30px, 0); } }

      main {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 2.2dvh, 22px);
        padding: clamp(10px, 2.5dvh, 28px) 16px;
      }

      .eyebrow {
        font-family: var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .tapped { font-size: 0.72rem; color: var(--accent); }

      .card-slot {
        width: min(360px, 90vw, calc((100dvh - 270px) * 0.75));
        aspect-ratio: 3 / 4;
        perspective: 1200px;
        container-type: inline-size;
        flex-shrink: 0;
      }
      .card {
        all: unset;
        box-sizing: border-box;
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transform-style: preserve-3d;
        transition: transform 700ms cubic-bezier(0.34, 1.3, 0.5, 1);
        animation: deal 1100ms cubic-bezier(0.22, 1.2, 0.36, 1) both;
      }
      .card[aria-pressed="true"] { transform: rotateY(180deg); }
      .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6cqw; }
      @keyframes deal {
        from { transform: translateY(40px) rotateY(-200deg) scale(0.85); opacity: 0; }
        to { transform: none; opacity: 1; }
      }

      .face {
        position: absolute;
        inset: 0;
        border-radius: 6cqw;
        padding: 1.6cqw;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        background: conic-gradient(from 210deg, #fbcfe8, #db2777, #c4b5fd, #f9a8d4, #fde68a, #fbcfe8);
        box-shadow: 0 30px 60px -20px rgba(219, 39, 119, 0.45);
      }
      .face.back { transform: rotateY(180deg); }
      .inner {
        position: relative;
        height: 100%;
        border-radius: 4.6cqw;
        overflow: hidden;
        background: linear-gradient(160deg, #2a1c27 0%, #17121a 55%, #0f0c11 100%);
        color: var(--card-text);
        display: flex;
        flex-direction: column;
        padding: 6cqw;
        text-align: left;
      }
      .inner::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        pointer-events: none;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
        animation: sheen 5s ease-in-out infinite;
      }
      @keyframes sheen {
        0%, 55% { transform: translateX(-120%) skewX(-18deg); }
        100% { transform: translateX(220%) skewX(-18deg); }
      }

      .photo {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
        border-radius: 3.5cqw;
        overflow: hidden;
        background: #141014;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .photo .blur {
        position: absolute;
        inset: -10%;
        width: 120%;
        height: 120%;
        object-fit: cover;
        filter: blur(14px) brightness(0.55);
      }
      .photo .sharp {
        position: relative;
        display: block;
        height: 100%;
        width: auto;
        max-width: 100%;
        margin: 0 auto;
        object-fit: contain;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
        mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
      }

      h1 {
        margin-top: 4cqw;
        font-family: var(--display);
        font-weight: 600;
        font-size: 10cqw;
        letter-spacing: -0.01em;
        line-height: 1.05;
        white-space: nowrap;
      }
      .role { margin-top: 1cqw; font-size: max(15px, 5.4cqw); color: rgba(247, 242, 245, 0.75); }

      .stats {
        margin-top: 4cqw;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding-top: 3.5cqw;
        list-style: none;
      }
      .stats li { text-align: center; padding: 0 1cqw; }
      .stats strong { display: block; font-size: 8cqw; font-weight: 700; color: var(--card-pink); line-height: 1.1; }
      .stats span { display: block; margin-top: 1cqw; font-size: max(12px, 3.9cqw); line-height: 1.25; color: rgba(247, 242, 245, 0.7); }
      .hint { margin-top: 3.5cqw; font-size: max(11px, 3.4cqw); text-align: center; opacity: 0.6; }

      .back h2 { font-size: 4.6cqw; color: #fde68a; }
      .points {
        margin-top: 5cqw;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 4.5cqw;
        flex: 1 1 auto;
        counter-reset: point;
      }
      .points li { display: flex; gap: 3cqw; font-size: 5.6cqw; line-height: 1.35; counter-increment: point; }
      .points li::before {
        content: "0" counter(point);
        font-family: var(--mono);
        font-weight: 700;
        letter-spacing: 0.12em;
        font-size: 4.4cqw;
        color: var(--card-pink);
        padding-top: 0.9cqw;
      }
      .school {
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding-top: 3.5cqw;
        font-size: 4.2cqw;
        color: rgba(247, 242, 245, 0.75);
      }

      .actions {
        width: min(360px, 100%);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        animation: rise 500ms 700ms ease-out both;
      }
      .tile {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 14px;
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text);
        text-decoration: none;
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid var(--border);
        transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
        -webkit-tap-highlight-color: transparent;
      }
      .tile:hover, .tile:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
      .tile:active { transform: scale(0.98); }
      .tile.logo { height: 64px; }
      .tile.resume { height: 48px; }
      .tile.resume svg { color: var(--accent); }
      .wallet { display: flex; align-items: center; justify-content: center; height: 48px; }
      .wallet img { height: 44px; width: auto; max-width: 100%; display: block; }

      .links {
        display: flex;
        gap: 18px;
        font-size: 0.85rem;
        animation: rise 500ms 800ms ease-out both;
      }
      .links a { color: var(--muted); text-decoration: none; font-weight: 600; transition: color 160ms ease; }
      .links a:hover { color: var(--accent); }

      @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

      @media (prefers-reduced-motion: reduce) {
        .card { animation: none; transition: none; }
        .inner::after { animation: none; opacity: 0; }
        .actions, .links { animation: none; }
        .glow span { animation: none; }
      }
    </style>
  </head>
